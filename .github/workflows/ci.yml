name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      # F821 (undefined name) es el chequeo que habría atrapado los siete
      # `st_canvas` sin importar antes de llegar a producción.
      - name: Lint (errores bloqueantes)
        run: ruff check --select F821,F811 .

      - name: Lint (completo, informativo)
        run: ruff check .
        continue-on-error: true

      - name: Tests
        run: pytest
