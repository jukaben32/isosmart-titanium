# ===========================================================================
# Parámetros técnicos del sistema EPS/ICF
# ---------------------------------------------------------------------------
# Fuente: docs/BASE_TECNICA_EPS_ICF.md (Covintec + notas del usuario, 2026-07).
#
# Las FÓRMULAS viven en utils/qto.py (son código). Los PARÁMETROS viven aquí
# (son datos). Ajustar un espesor o un rendimiento no debe requerir tocar Python.
#
# Cada valor lleva su origen:
#   [doc]      -> viene textualmente de BASE_TECNICA_EPS_ICF.md
#   [supuesto] -> estimación de ingeniería, PENDIENTE de validar con obra real
# ===========================================================================

version: "1.0"
fecha: "2026-07-26"

# ---------------------------------------------------------------------------
# Panel
# ---------------------------------------------------------------------------
panel:
  ancho_util_m: 1.22          # [doc] panel estándar 1.22 x 2.44 m
  largo_estandar_m: 2.44      # [doc]
  largo_maximo_m: 6.10        # [doc] fabricable hasta 6.10 m

# ---------------------------------------------------------------------------
# Espesores de mortero y concreto
# ---------------------------------------------------------------------------
espesores:
  mortero_muro_por_cara_m: 0.025   # [doc] 2.5 cm por cara. CONFIRMADO por Manual
                                    # Técnico Panel Covintec 2011 ("Mortero de 2.5
                                    # cm. de Espesor") -- coincide exactamente.
  # [doc] Video #37 "Cuantificación de Materiales" (NotebookLM del usuario):
  # "La capa de compresión en losas varía: 4 a 5 cm en azoteas y 6 a 7 cm
  # en entrepisos". Coincide con el rango de BASE_TECNICA_EPS_ICF.md (5 cm).
  #
  # CORREGIDO de nuevo: la ronda anterior había bajado esto a 3.5 cm citando
  # el Manual Técnico Panel Covintec 2011 ("CAPA DE COMPRESION DE 3.5 cm"),
  # pero ese dato aparecía en la ficha de un producto específico (Qualy
  # Panel 3"), no como práctica general de azotea. Con DOS fuentes
  # independientes coincidiendo en 4-5 cm (BASE_TECNICA y este video de
  # cuantificación), se usa el punto medio de ese rango en vez del dato de
  # ficha de producto, más estrecho y posiblemente no generalizable.
  losa_azotea_m: 0.045
  losa_entrepiso_m: 0.065          # [doc] 6-7 cm (BASE_TECNICA; el manual Covintec
                                    # no distingue azotea/entrepiso explícitamente)
  # [doc] Manual Técnico Panel Covintec 2011, sección 1.4: "La losa de
  # cimentación tendrá 10 cm. de espesor". Antes: 0.125 (punto medio del rango
  # 10-15cm de BASE_TECNICA); ahora hay un valor específico de fuente primaria.
  cimentacion_platea_m: 0.10
  plantilla_concreto_pobre_m: 0.075  # [doc] plantilla 5-10 cm (BASE_TECNICA_EPS_ICF.md;
                                       # no aparece en el Manual Técnico Covintec, que no
                                       # lo contradice, solo no lo menciona)
  replantillo_m: 0.135             # [doc] replantillo 12-15 cm en fondo de excavación
                                     # (BASE_TECNICA_EPS_ICF.md; el Manual Técnico
                                     # Covintec no lo menciona como partida separada)
  # [doc] Manual Técnico Panel Covintec 2011, sección 1.3: "Dentellones
  # perimetrales en línea de ejes... corona 20 cm, base 15 cm, peralte 15 cm.
  # Reforzada con armex 15x25/4". Elemento estructural bajo el perímetro de la
  # losa que el motor NO incluía hasta esta verificación.
  dentellon_corona_m: 0.20
  dentellon_base_m: 0.15
  dentellon_peralte_m: 0.15

# ---------------------------------------------------------------------------
# Resistencias (kg/cm²)
# ---------------------------------------------------------------------------
resistencias:
  losa_minima: 200          # [doc] mínimo en losa
  microconcreto: 235        # [doc] 220-250
  # [doc] BASE_TECNICA_EPS_ICF.md decía 250 kg/cm² para "zapata/cimentación".
  # Manual Técnico Panel Covintec 2011, sección 1.6: "Colado de concreto
  # f'c = 200 kg/cm², espesor de capa 10 cm" -- describe explícitamente el
  # colado de la losa de cimentación (la misma partida de esta sección) a
  # 200 kg/cm², no 250. Es una fuente PRIMARIA del fabricante, más confiable
  # aquí que BASE_TECNICA (derivado de notas sobre videos de YouTube).
  # 200 kg/cm² es también más cercano a H_3000_PSI (≈211 kg/cm²) que a
  # H_3500_PSI (≈246 kg/cm²) -- se revierte el cambio de la ronda anterior
  # que había movido esta partida a H_3500_PSI.
  cimentacion: 200

# ---------------------------------------------------------------------------
# Rendimientos de mezcla
# ---------------------------------------------------------------------------
# [doc] Cemento 50 kg -> 138-148 L de concreto a 250 kg/cm². Se toma el punto medio.
# [doc] Proporción 250: 1 bulto cemento : 3.5 botes arena : 5.5 botes grava (bote 19 L).
mezclas:
  bote_litros: 19
  concreto:
    rendimiento_m3_por_bulto: 0.143   # [doc] 143 L por bulto de 50 kg
    botes_arena_por_bulto: 3.5        # [doc]
    botes_grava_por_bulto: 5.5        # [doc]
  mortero:
    rendimiento_m3_por_bulto: 0.12    # [supuesto] VERIFICAR con proveedor
    botes_arena_por_bulto: 7.0        # [doc] 1 bulto mortero : 7 botes arena
  # [doc] Prohibido usar CAL (daña la malla de acero).
  # [doc] Usar microfibra sintética + impermeabilizante integral.
  aditivos:
    microfibra_kg_por_bulto: 1.0      # [doc] 1 kg/bulto (2 kg en cisternas/albercas)

# ---------------------------------------------------------------------------
# Anclaje y mallas de refuerzo
# ---------------------------------------------------------------------------
anclaje:
  anclas_por_panel: 3               # [doc] varilla 3/8", cada 40 cm, 3 por panel
  separacion_m: 0.40                # [doc] CONFIRMADO: Manual Técnico Panel Covintec
                                     # 2011 dice "separación de 40 cm" -- coincide.
  # ---------------------------------------------------------------------
  # RESUELTO (revisión de precisión, continuación 2026-07-26): la ronda
  # anterior dejó esto como conflicto abierto entre BASE_TECNICA_EPS_ICF.md
  # ("5 cm dentro de cimentación") y un manual de instalación distinto que
  # mencionaba "40-50 cm de empotramiento" para un elemento sin identificar
  # con certeza.
  #
  # El Manual Técnico Panel Covintec 2011 (fuente PRIMARIA del fabricante,
  # corroborada en 5 copias independientes) lo resuelve con precisión,
  # sección 1.5: "Recibidores de cortante basándose en varilla del 3/8" en
  # forma de 'U' con una separación de 40 cm, entre cada una y una longitud
  # EMPOTRADA en la losa de cimentación de 10 cm., y una longitud LIBRE
  # para anclaje de paneles de 40 cm."
  #
  # Es decir: 10 cm dentro de la losa (el doble de lo que decía
  # BASE_TECNICA, no el 40-50cm de la otra fuente -- ese detalle
  # probablemente describía un elemento distinto, como el armex del
  # dentellón perimetral). Total: 10 cm empotrado + 40 cm libre hacia el
  # muro = 50 cm por ancla en forma de "U".
  longitud_empotrada_m: 0.10        # [doc] Manual Técnico Panel Covintec 2011
  longitud_libre_muro_m: 0.40       # [doc] Manual Técnico Panel Covintec 2011
  longitud_ancla_m: 0.50            # [doc] suma de las dos anteriores (antes: 0.60 [supuesto])
  peso_varilla_3_8_kg_por_m: 0.56   # [doc] peso nominal varilla 3/8" (tabla estándar de acero)
  fuente_manual_tecnico_covintec: "https://es.scribd.com/document/237263489/Manual-Tecnico-Covintec-2011"

mallas:
  # [doc] ventana 90x90 = 12 piezas; puerta 215x90 = 13 piezas.
  # CONFIRMADO por video #37 "Cuantificación de Materiales" (NotebookLM del
  # usuario): mismos valores de referencia para vanos estándar.
  #
  # CORREGIDO (verificado con el desglose del video, 2026-07-26): "12/13
  # piezas" YA INCLUYE ambas caras del panel -- el propio video lo explica:
  # "4 lados x 2 caras = 8 piezas + 4 piezas para diagonales = 12 unidades
  # FIJAS". La nota original de BASE_TECNICA_EPS_ICF.md ("AMBOS LADOS x2")
  # se interpretó como "multiplicar por 2 además de las 12/13", cuando en
  # realidad esas 12/13 YA ERAN el total de ambas caras. El motor venía
  # duplicando esta partida (326 piezas en vez de 163 para el caso base de
  # 120 m²) desde la Fase 1.
  zigzag_piezas_por_ventana: 12
  zigzag_piezas_por_puerta: 13
  # `zigzag_lados` ya NO se aplica como multiplicador sobre el conteo de
  # referencia (ver arriba); se mantiene como parámetro para la fórmula de
  # vanos no estándar de abajo, donde "x2 caras" sigue siendo un paso
  # explícito y verificado del cálculo (no una duplicación del conteo fijo).
  zigzag_lados: 2
  # [doc] VERIFICADO con ejemplo numérico resuelto por el usuario (video
  # #37 "Cuantificación de Materiales", NotebookLM): para vanos NO
  # estándar, la fórmula es (perímetro + 4 x excedente diagonal) x 2 caras
  # / 1.22 m, redondeado hacia arriba. Confirmado paso a paso para una
  # ventana de 1.5x1.2 m -> exactamente 12 piezas.
  #
  # El excedente es "de 30 a 40 cm en cada esquina"; el ejemplo resuelto
  # usa 0.40 m (el extremo superior) explícitamente, así que se usa ese
  # valor exacto en vez de un punto medio.
  zigzag_excedente_diagonal_m: 0.40
  # [doc] VERIFICADO con NotebookLM del usuario: son DOS productos
  # distintos por esquina, no una malla que se dobla -- interna (10x10 o
  # 14x14 cm x 2.40 m) y externa (20x20 cm x 2.40 m). El redondeo se hace
  # POR ESQUINA Y POR TIPO: ceil(altura / 2.40), nunca en agregado (ejemplo
  # resuelto: esquina de 2.80 m -> ceil(2.80/2.40)=2 piezas de cada tipo,
  # NO ceil(2.80*2/2.40)=3, que subestimaría). También se añaden a las
  # uniones entre muro y losa (video #37), un uso que antes no estaba
  # modelado en absoluto.
  # [doc] VERIFICADO con NotebookLM del usuario: esquinas entrantes
  # (cóncavas, ej. el interior de una "L") y salientes (convexas) reciben
  # el MISMO tratamiento -- una tira interna y una externa por cada
  # esquina, sin importar el tipo. No hace falta distinguirlas en el
  # conteo; `Geometria.esquinas` ya admite indicar el total real
  # (ej. 6 para una casa en L simple) en vez del default de 4.
  esquinera_largo_pieza_m: 2.40
  # [doc] malla unión: 10 cm x 2.40 m, ambos lados. Video #37: "necesarias
  # cuando la altura del muro supera los 2.44 m, o en cortes donde no existe
  # la pestaña de autoensamble". Antes: solo se estimaba por la fracción
  # arbitraria de paneles cortados (union_fraccion_paneles_cortados,
  # [supuesto]); ahora se añade la condición real de altura como un
  # segundo motivo documentado, aplicado sobre el largo total de muro.
  union_largo_pieza_m: 2.40
  union_lados: 2
  union_altura_umbral_m: 2.44              # [doc] video #37
  union_fraccion_paneles_cortados: 0.25    # [supuesto] % de paneles que requieren corte
  # Malla electrosoldada 10x10 en cimentación
  electrosoldada_traslape: 1.10           # [supuesto] 10% de traslape

# ---------------------------------------------------------------------------
# Mano de obra
# ---------------------------------------------------------------------------
# [doc] Aplanado manual 15-20 m²/día; lanzadora neumática 60-70 m²/día.
mano_obra:
  # [doc] Aplanado manual 15-20 m²/día; lanzadora neumática 60-70 m²/día.
  # VERIFICADO: estos rendimientos siguen la convención estándar de Análisis
  # de Precios Unitarios (APU) -- son la producción de la CUADRILLA
  # completa, no de un trabajador individual. Ver utils/qto.py::_jornal()
  # para el detalle de la verificación y la fuente.
  aplanado_m2_dia_manual: 17.5
  # [doc] "Aplanado mecánico (lanzadora): rendimiento sube a 70 m²/jornada"
  # (NotebookLM del usuario, videos #20/#34 "Costos del sistema Covintec").
  # Coincide con el extremo superior del rango de BASE_TECNICA (60-70
  # m²/día); se conserva 65 (punto medio) por tener doble confirmación.
  aplanado_m2_dia_lanzadora: 65.0
  # [doc] "Armado de muros: cuadrilla (1 oficial + 2 ayudantes) rinde
  # 18 m² por jornada" (NotebookLM del usuario, videos #20/#34). Antes: 45.0
  # [supuesto], sin ninguna fuente -- 2.5x más optimista que el dato real.
  # La composición de cuadrilla (1+2=3) coincide con cuadrilla_personas.
  montaje_panel_m2_dia: 18.0
  cimentacion_m2_dia: 25.0          # [supuesto] -- sin confirmar en los videos revisados
  # [doc] "Armado de losa (Qualylosa): rendimiento de 15 m² por jornada"
  # (NotebookLM del usuario, videos #20/#34). Antes: 30.0 [supuesto], el
  # doble de rápido que el dato real.
  losa_m2_dia: 15.0
  # [supuesto], pero corroborado: tablas de rendimiento por cuadrilla en
  # construcción latinoamericana usan típicamente "1 Albañil + 1 Ayudante +
  # 1 Peón" (3 personas) para actividades de aplanado/repello -- coincide
  # con este valor. Y ahora también con "1 oficial + 2 ayudantes" del
  # video de costos (NotebookLM del usuario).
  cuadrilla_personas: 3
  # [doc] "Herramienta menor: 3%" del costo de mano de obra, para no perder
  # el desgaste de herramienta al presupuestar (NotebookLM del usuario,
  # videos #20/#34 "Costos del sistema Covintec", citando Art. 185 de la
  # Ley de Obras Públicas: Costo Directo = materiales + mano de obra +
  # herramienta). Antes: ausente del modelo por completo.
  herramienta_menor_pct: 0.03

# ---------------------------------------------------------------------------
# Geometría por defecto (cuando no se extrae del plano)
# ---------------------------------------------------------------------------
geometria_defecto:
  altura_muro_m: 2.80
  esquinas: 4
  # Muros divisorios interiores como fracción de los perimetrales.
  factor_muros_interiores: 0.90     # [supuesto] típico residencial
  ventanas_por_100m2: 5.0           # [supuesto]
  puertas_ext_por_vivienda: 2.0     # [supuesto]
  puertas_int_por_100m2: 4.0        # [supuesto]
  banos_por_100m2: 1.7              # [supuesto]
  metros_lineales_cocina_por_100m2: 4.0   # [supuesto]

# ---------------------------------------------------------------------------
# Desperdicios
# ---------------------------------------------------------------------------
# El panel NO lleva desperdicio porcentual: la modulación a 1.22 m con redondeo
# hacia arriba ya lo incorpora de forma física (y más exacta que un 5% plano).
desperdicios:
  concreto: 0.08
  mortero: 0.10
  acero: 0.05
  mallas: 0.05
  acabados: 0.05

# ---------------------------------------------------------------------------
# Comparación contra construcción tradicional
# ---------------------------------------------------------------------------
# [doc] EPS/ICF ahorra 20-40% en OBRA GRIS (no en acabados, que son iguales).
# [doc] Default sugerido: 27.5%. El "83%" anterior comparaba obra gris EPS
#       contra obra TERMINADA tradicional: peras con manzanas.
comparacion_tradicional:
  ahorro_obra_gris_min: 0.20
  ahorro_obra_gris_default: 0.275
  ahorro_obra_gris_max: 0.40
  ahorro_acabados: 0.0      # [doc] los acabados son iguales en ambos sistemas
  # Rendimiento de plazo de ejecución (días/m²)
  dias_por_m2_eps: 0.9      # [supuesto]
  dias_por_m2_tradicional: 2.5

# ---------------------------------------------------------------------------
# Factores por zona de riesgo (RD)
# ---------------------------------------------------------------------------
zonas_riesgo:
  moderado: {acero: 1.00, hormigon: 1.00}
  alto: {acero: 1.20, hormigon: 1.10}
  muy_alto: {acero: 1.35, hormigon: 1.00}

# ---------------------------------------------------------------------------
# Objetivo de precisión
# ---------------------------------------------------------------------------
# [doc] "el cálculo real debe caer dentro de ±5% del costo ejecutado"
objetivo:
  tolerancia_vs_obra_ejecutada: 0.05
